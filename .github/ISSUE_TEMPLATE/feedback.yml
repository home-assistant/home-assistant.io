name: Documentation feedback
description: Provide feedback on a page on our website
body:
  - type: markdown
    attributes:
      value: |
        Thanks for opening an issue to provide feedback on our website/documentation.

        **Please note, this form is not for reporting bugs with running Home Assistant or its integrations.**
        Those bugs should be reported in the [Home Assistant Core issue tracker][core].

        [core]: https://github.com/home-assistant/core/issues
  - type: dropdown
    id: issue-type
    attributes:
      label: Type of issue
      description: >-
        If more than one type applies, choose the most relevant one.
      options:
        - Grammatical error or typo
        - Documentation not according to the Home Assistant style guide
        - Outdated or incorrect information
        - Missing information
        - Unclear or confusing information
        - Other (issue in content formatting, broken link or image, non-working widget)
    validations:
      required: true
  - type: textarea
    id: problem-description
    attributes:
      label: Problem description
      description: >-
        Clearly describe what is wrong, missing, or unclear in the documentation.
    validations:
      required: true
  - type: textarea
    id: suggested-solution
    attributes:
      label: Suggested solution
      description: >-
        If you have found a solution, write the correct information as concretely as possible.
        If you know the correct value or behavior, state it directly (for example: "step X should say Y, not Z").
  - type: markdown
    attributes:
      value: |
        ## Details
  - type: input
    id: url
    attributes:
      label: URL
      placeholder: "http://www.home-assistant.io/..."
      description: >
        A URL with a link to the page you are providing feedback for.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "For example: 2022.7.0"
      description: >
        Latest stable version of Home Assistant available
        (which does not have to match the version you are using).
  - type: textarea
    id: evidence
    attributes:
      label: How do you know the suggested solution is correct?
      description: >
        If applicable, link a source that backs up your proposed fix to help the writer verify it
        without redoing your research. For example, a merged PR that changed the documented behavior, 
        the relevant source code, release notes, a configuration you ran, or describe your own test.
      placeholder: "For example: Tested on Home Assistant Core 2026.9.1, config: ..., see home-assistant/core#XXXXX"
  - type: textarea
    attributes:
      label: Additional information
      description: >
        If you have any additional information for us, use the field below.
        You can attach screenshots or screen recordings here by
        dragging and dropping files in the field below.
