        columns: 12
      features:
        - type: cover-position

  feature_cover_position_favorite:
    - type: tile
      entity: cover.living_room_blinds
      grid_options:
        columns: 12
      features:
        - type: cover-position-favorite

  feature_cover_tilt:
    - type: tile
      entity: cover.pergola_roof
