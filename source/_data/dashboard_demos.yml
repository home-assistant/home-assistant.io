    state: "on"
    area_id: kitchen
    attributes:
      friendly_name: Kitchen ceiling
      supported_color_modes:
        - brightness
      color_mode: brightness
      brightness: 200
  - entity_id: light.kitchen_counter
    state: "off"
    area_id: kitchen
    attributes:
      friendly_name: Kitchen counter
      supported_color_modes:
        - onoff
      color_mode: onoff
  - entity_id: fan.kitchen_fan
    state: "on"
    area_id: kitchen
    attributes:
      friendly_name: Kitchen fan
      percentage: 50
      supported_features: 1
  - entity_id: switch.kettle
    state: "off"
    area_id: kitchen
    attributes:
      friendly_name: Kettle
      device_class: outlet
  - entity_id: sensor.kitchen_temperature
    state: "21.4"
    area_id: kitchen
    attributes:
      friendly_name: Kitchen temperature
      device_class: temperature
      state_class: measurement
      unit_of_measurement: °C
  - entity_id: sensor.kitchen_air_humidity
    state: "48"
    area_id: kitchen
    attributes:
      friendly_name: Kitchen air humidity
      device_class: humidity
      state_class: measurement
      unit_of_measurement: "%"
  - entity_id: weather.home
    state: partlycloudy
    attributes:
      friendly_name: Home
      temperature: 14
      temperature_unit: °C
      precipitation_unit: mm
      supported_features: 1

areas:
  - area_id: kitchen
    name: Kitchen

demos:
  light_names:
    - type: light
      entity: light.bedroom
      name: Kids bedroom
      grid_options:
        columns: 6
    - type: light
      entity: light.office
      name: My office
      grid_options:
        columns: 6

  gauge_name_unit:
    - type: gauge
      name: CPU usage
      unit: "%"
      entity: sensor.cpu_usage

  gauge_segments:
    - type: gauge
      entity: sensor.kitchen_humidity
      needle: true
      min: 20
      max: 80
      segments:
        - from: 0
          color: "#db4437"
        - from: 35
          color: "#ffa600"
        - from: 40
          color: "#43a047"
        - from: 60
          color: "#ffa600"
        - from: 65
          color: "#db4437"

  # Clock card, the examples of source/_dashboards/clock.markdown
  clock_default:
    - type: clock

  clock_large:
    - type: clock
      clock_size: large
      time_format: "12"
      show_seconds: true

  clock_medium:
    - type: clock
      clock_size: medium
      time_format: "12"
      show_seconds: false

  clock_london:
    - type: clock
      clock_size: medium
      time_zone: Europe/London
      title: London 💂

  clock_new_york:
    - type: clock
      clock_size: medium
      time_format: "12"
      time_zone: America/New_York
      title: New York 🦅

  clock_analog_hour_ticks:
    - type: clock
      clock_style: analog
      clock_size: medium
      analog_options:
        border: false
        ticks: hour

  clock_analog_minute_ticks:
    - type: clock
      clock_style: analog
      clock_size: medium
      show_seconds: true
      analog_options:
        border: true
        ticks: minute

  clock_analog_no_ticks:
    - type: clock
      clock_style: analog
      clock_size: medium
      show_seconds: true
      analog_options:
        border: true
        ticks: none
      title: Mountain Time

  # Date card, the examples of source/_dashboards/date.markdown
  date_default:
    - type: date

  date_large:
    - type: date
      title: Today
      date_size: large

  date_day_month_year:
    - type: date
      date_format:
        - day-2-digit
        - separator-slash
        - month-2-digit
        - separator-slash
        - year-numeric

  date_tokyo:
    - type: date
      title: Tokyo
      time_zone: Asia/Tokyo
      no_background: true

  # Card features, one tile card each, with the feature of the example on
  # source/dashboards/features.markdown
  feature_alarm_modes:
    - type: tile
      entity: alarm_control_panel.home_alarm
      grid_options:
        columns: 12
      features:
        - type: alarm-modes
          modes:
            - armed_home
            - armed_away
            - armed_night
            - armed_vacation
            - armed_custom_bypass
            - disarmed

  feature_bar_gauge:
    - type: tile
      entity: sensor.phone_battery
      grid_options:
        columns: 12
      features:
        - type: bar-gauge
          min: 0
          max: 100
          segments:
            - from: 0
              color: "#db4437"
            - from: 35.5
              color: "#ffa600"
            - from: 40
              color: "#43a047"
            - from: 60
              color: "#ffa600"
            - from: 65
              color: "#db4437"

  feature_button:
    - type: tile
      entity: button.restart_router
      grid_options:
        columns: 12
      features:
        - type: button
          action_name: Press

  feature_climate_fan_modes:
    - type: tile
      entity: climate.living_room
      grid_options:
        columns: 12
      features:
        - type: climate-fan-modes
          style: icons
          fan_modes:
            - "off"
            - low
            - medium
            - high

  feature_climate_hvac_modes:
    - type: tile
      entity: climate.living_room
      grid_options:
        columns: 12
      features:
        - type: climate-hvac-modes
          hvac_modes:
            - auto
            - heat_cool
            - heat
            - cool
            - dry
            - fan_only
            - "off"

  feature_climate_preset_modes:
    - type: tile
      entity: climate.living_room
      grid_options:
        columns: 12
      features:
        - type: climate-preset-modes
          style: icons
          preset_modes:
            - home
            - eco

  feature_climate_swing_modes:
    - type: tile
      entity: climate.living_room
      grid_options:
        columns: 12
      features:
        - type: climate-swing-modes
          style: icons
          swing_modes:
            - "on"
            - "off"

  feature_climate_swing_horizontal_modes:
    - type: tile
      entity: climate.living_room
      grid_options:
        columns: 12
      features:
        - type: climate-swing-horizontal-modes
          style: dropdown
          swing_horizontal_modes:
            - "on"
            - "off"

  feature_counter_actions:
    - type: tile
      entity: counter.coffees_today
      grid_options:
        columns: 12
      features:
        - type: counter-actions
          actions:
            - increment
            - decrement
