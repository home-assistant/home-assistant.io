      grid_options:
        columns: 12
      features:
        - type: cover-tilt-favorite

  feature_cover_tilt_position:
    - type: tile
      entity: cover.pergola_roof
      grid_options:
        columns: 12
      features:
        - type: cover-tilt-position

  feature_date:
    - type: tile
      entity: date.next_filter_change
      grid_options:
        columns: 12
      features:
        - type: date-set

  feature_fan_direction:
    - type: tile
