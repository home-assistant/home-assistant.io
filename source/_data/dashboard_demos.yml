# Live card demos for the dashboard docs, rendered by
# source/_includes/dashboard/demo.html with the embed of the Home Assistant
# demo: https://contributors.home-assistant.io/frontend/custom-ui/demo/
#
# Each entry in `demos` holds the configuration of its cards, the same as in
# a dashboard. A demo gets the entities of `entities` that its cards name in
# their `entity`, or that are in the `area` of a card, with that area from
# `areas`.

entities:
  # Card features, see source/dashboards/features.markdown
  - entity_id: alarm_control_panel.home_alarm
    state: disarmed
    attributes:
      friendly_name: Home alarm
      code_arm_required: false
      supported_features: 55
  - entity_id: sensor.phone_battery
    state: "72"
    attributes:
      friendly_name: Phone battery
      device_class: battery
      state_class: measurement
      unit_of_measurement: "%"
  - entity_id: button.restart_router
    state: "2026-11-04T08:15:00+00:00"
    attributes:
      friendly_name: Restart router
      device_class: restart
  - entity_id: climate.living_room
    state: heat
    attributes:
      friendly_name: Living room
      current_temperature: 20.5
      temperature: 21
      min_temp: 7
      max_temp: 30
      target_temp_step: 0.5
      hvac_action: heating
      hvac_modes:
        - auto
        - heat_cool
        - heat
        - cool
        - dry
        - fan_only
        - "off"
      fan_mode: low
      fan_modes:
        - "off"
        - low
        - medium
        - high
      preset_mode: home
      preset_modes:
        - home
        - eco
      swing_mode: "on"
      swing_modes:
        - "on"
        - "off"
      swing_horizontal_mode: "off"
      swing_horizontal_modes:
        - "on"
        - "off"
      supported_features: 953
  - entity_id: climate.bedroom
    state: heat
    attributes:
      friendly_name: Bedroom
      current_temperature: 18.5
      temperature: 19
      min_temp: 7
      max_temp: 30
      target_temp_step: 0.5
      hvac_action: heating
      hvac_modes:
        - heat
        - "off"
      supported_features: 1
  - entity_id: counter.coffees_today
    state: "3"
    attributes:
      friendly_name: Coffees today
      initial: 0
      step: 1
      minimum: 0
      maximum: 20
  - entity_id: cover.living_room_blinds
    state: open
    attributes:
      friendly_name: Living room blinds
      device_class: blind
      current_position: 70
      supported_features: 15
  - entity_id: cover.pergola_roof
    state: open
    attributes:
      friendly_name: Pergola roof
      device_class: awning
      current_tilt_position: 60
      supported_features: 240
  - entity_id: date.next_filter_change
    state: "2026-12-01"
    attributes:
      friendly_name: Next filter change
  - entity_id: fan.ceiling_fan
    state: "on"
    attributes:
      friendly_name: Ceiling fan
      percentage: 67
      percentage_step: 33.333333333333336
      direction: forward
      oscillating: false
      preset_mode: auto
      preset_modes:
        - auto
        - smart
        - sleep
        - "on"
      supported_features: 63
  - entity_id: humidifier.bedroom_humidifier
    state: "on"
    attributes:
      friendly_name: Bedroom humidifier
      device_class: humidifier
      humidity: 45
      current_humidity: 41
      min_humidity: 30
      max_humidity: 70
      mode: home
      available_modes:
        - home
        - eco
        - sleep
        - boost
      supported_features: 1
  - entity_id: lawn_mower.front_lawn
    state: docked
    attributes:
      friendly_name: Front lawn mower
      supported_features: 7
  - entity_id: light.living_room
    state: "on"
    attributes:
      friendly_name: Living room
      supported_color_modes:
        - brightness
      color_mode: brightness
      brightness: 180
  - entity_id: light.desk_lamp
    state: "on"
    attributes:
      friendly_name: Desk lamp
      supported_color_modes:
        - hs
        - color_temp
      color_mode: hs
      hs_color:
        - 210
        - 60
      brightness: 200
      min_color_temp_kelvin: 2000
      max_color_temp_kelvin: 6500
      color_temp_kelvin: 3000
  - entity_id: light.reading_lamp
    state: "on"
    attributes:
      friendly_name: Reading lamp
      supported_color_modes:
        - color_temp
      color_mode: color_temp
      brightness: 200
      min_color_temp_kelvin: 2000
      max_color_temp_kelvin: 6500
      color_temp_kelvin: 3200
  - entity_id: light.led_strip
    state: "on"
    attributes:
      friendly_name: LED strip
      supported_color_modes:
        - hs
      color_mode: hs
      hs_color:
        - 280
        - 70
      brightness: 220
      effect: Rainbow
      effect_list:
        - Solid
        - Rainbow
        - Candle
        - Fireplace
      supported_features: 4
  - entity_id: lock.front_door
    state: locked
    attributes:
      friendly_name: Front door
      supported_features: 1
  - entity_id: media_player.living_room_speaker
    state: playing
    attributes:
      friendly_name: Living room speaker
      media_title: Clair de lune
      media_artist: Claude Debussy
      volume_level: 0.45
      is_volume_muted: false
      source: TV
      source_list:
        - TV
        - Bluetooth
        - Radio
      sound_mode: music
      sound_mode_list:
        - movie
        - music
        - game
      supported_features: 85437
  - entity_id: input_number.oven_timer
    state: "25"
    attributes:
      friendly_name: Oven timer
      min: 0
      max: 120
      step: 5
      mode: slider
      unit_of_measurement: min
  - entity_id: input_select.washer_program
    state: Normal
    attributes:
      friendly_name: Washer program
      options:
        - Normal
        - Delicates
        - Heavy duty
        - Quick wash
  # Paused, as an active timer counts down to a fixed time that would be past
  - entity_id: timer.laundry
    state: paused
    attributes:
      friendly_name: Laundry
      duration: "0:45:00"
      remaining: "0:32:10"
    # Presets in seconds, kept in the entity registry
    options:
      timer:
        presets:
          - 300
          - 900
          - 1800
          - 3600
  - entity_id: switch.coffee_maker
    state: "on"
    attributes:
      friendly_name: Coffee maker
      device_class: outlet
  - entity_id: sensor.outside_temperature
    state: "12.3"
    attributes:
      friendly_name: Outside temperature
      device_class: temperature
      state_class: measurement
      unit_of_measurement: °C
  - entity_id: update.living_room_speaker_firmware
    state: "on"
    attributes:
      friendly_name: Living room speaker firmware
      installed_version: "2.4.1"
      latest_version: "2.5.0"
      title: Speaker firmware
      in_progress: false
      supported_features: 9
  - entity_id: vacuum.downstairs_vacuum
    state: docked
    attributes:
      friendly_name: Downstairs vacuum
      fan_speed: Standard
      fan_speed_list:
        - Quiet
        - Standard
        - Turbo
        - Max
      supported_features: 13884
  - entity_id: valve.garden_irrigation
    state: open
    attributes:
      friendly_name: Garden irrigation
      device_class: water
      current_position: 60
      supported_features: 15
  - entity_id: water_heater.water_heater
    state: eco
    attributes:
      friendly_name: Water heater
      operation_mode: eco
      operation_list:
        - electric
        - gas
        - heat_pump
        - eco
        - performance
        - high_demand
        - "off"
      temperature: 55
      current_temperature: 52
      min_temp: 40
      max_temp: 70
      target_temp_step: 1
      supported_features: 3
  - entity_id: light.kitchen_ceiling
    state: "on"
    area_id: kitchen
    attributes:
      friendly_name: Kitchen ceiling
      supported_color_modes:
        - brightness
      color_mode: brightness
      brightness: 200
  - entity_id: light.kitchen_counter
    state: "off"
    area_id: kitchen
    attributes:
      friendly_name: Kitchen counter
      supported_color_modes:
        - onoff
      color_mode: onoff
  - entity_id: fan.kitchen_fan
    state: "on"
    area_id: kitchen
    attributes:
      friendly_name: Kitchen fan
      percentage: 50
      supported_features: 1
  - entity_id: switch.kettle
    state: "off"
    area_id: kitchen
    attributes:
      friendly_name: Kettle
      device_class: outlet
  - entity_id: sensor.kitchen_temperature
    state: "21.4"
    area_id: kitchen
    attributes:
      friendly_name: Kitchen temperature
      device_class: temperature
      state_class: measurement
      unit_of_measurement: °C
  - entity_id: sensor.kitchen_air_humidity
    state: "48"
    area_id: kitchen
    attributes:
      friendly_name: Kitchen air humidity
      device_class: humidity
      state_class: measurement
      unit_of_measurement: "%"
  - entity_id: weather.home
    state: partlycloudy
    attributes:
      friendly_name: Home
      temperature: 14
      temperature_unit: °C
      precipitation_unit: mm
      supported_features: 1

areas:
  - area_id: kitchen
    name: Kitchen

