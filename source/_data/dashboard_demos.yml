demos:
  # Card features, one tile card each, with the feature of the example on
  # source/dashboards/features.markdown
  feature_alarm_modes:
    - type: tile
      entity: alarm_control_panel.home_alarm
      grid_options:
        columns: 12
      features:
        - type: alarm-modes
          modes:
            - armed_home
            - armed_away
            - armed_night
            - armed_vacation
            - armed_custom_bypass
