  # Clock card, the examples of source/_dashboards/clock.markdown
  clock_default:
    - type: clock

  clock_large:
    - type: clock
      clock_size: large
      time_format: "12"
      show_seconds: true

  clock_medium:
    - type: clock
      clock_size: medium
      time_format: "12"
      show_seconds: false

  clock_london:
    - type: clock
      clock_size: medium
      time_zone: Europe/London
      title: London 💂

  clock_new_york:
    - type: clock
      clock_size: medium
      time_format: "12"
      time_zone: America/New_York
      title: New York 🦅

  clock_analog_hour_ticks:
    - type: clock
      clock_style: analog
      clock_size: medium
      border: false
      ticks: hour

  clock_analog_minute_ticks:
    - type: clock
      clock_style: analog
      clock_size: medium
      show_seconds: true
      border: true
      ticks: minute

  clock_analog_no_ticks:
    - type: clock
      clock_style: analog
      clock_size: medium
      show_seconds: true
      border: true
      ticks: none
      title: Mountain Time

  # Date card, the examples of source/_dashboards/date.markdown
  date_default:
    - type: date

  # Full width, as the long weekday doesn't fit in the default 6 columns of a
  # large date card.
  date_large:
    - type: date
      title: Today
      date_size: large
      grid_options:
        columns: 12

  date_day_month_year:
    - type: date
      date_format:
        - day-2-digit
        - separator-slash
        - month-2-digit
        - separator-slash
        - year-numeric

  date_tokyo:
    - type: date
      title: Tokyo
      time_zone: Asia/Tokyo
      no_background: true

  # Button card, source/_dashboards/button.markdown
  button_top:
    - type: button
      entity: switch.ac
      grid_options:
        columns: 4
    - type: button
      entity: script.bedtime_routine
      show_icon: false
      grid_options:
        columns: 4
    - type: button
      entity: lock.kitchen_door
      grid_options:
        columns: 4

  button_script:
    - type: button
      name: Turn Off Lights
      icon: mdi:script-text
      show_state: false
      tap_action:
        action: perform-action
        perform_action: script.turn_on
        data:
          entity_id: script.turn_off_lights

