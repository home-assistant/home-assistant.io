demos:
  # Card features, one tile card each, with the feature of the example on
  # source/dashboards/features.markdown
  feature_alarm_modes:
    - type: tile
      entity: alarm_control_panel.home_alarm
      grid_options:
        columns: 12
      features:
        - type: alarm-modes
          modes:
            - armed_home
            - armed_away
            - armed_night
            - armed_vacation
            - armed_custom_bypass
            - disarmed

  feature_bar_gauge:
    - type: tile
      entity: sensor.phone_battery
      grid_options:
        columns: 12
      features:
        - type: bar-gauge
          min: 0
          max: 100
          segments:
            - from: 0
              color: "#db4437"
            - from: 35.5
              color: "#ffa600"
            - from: 40
              color: "#43a047"
            - from: 60
              color: "#ffa600"
            - from: 65
              color: "#db4437"

  feature_button:
    - type: tile
      entity: button.restart_router
      grid_options:
        columns: 12
      features:
        - type: button
          action_name: Press

  feature_climate_fan_modes:
    - type: tile
      entity: climate.living_room
      grid_options:
        columns: 12
      features:
        - type: climate-fan-modes
          style: icons
          fan_modes:
