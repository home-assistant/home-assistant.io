# Live card demos for the dashboard docs, rendered by
# source/_includes/dashboard/demo.html with the embed of the Home Assistant
# demo: https://contributors.home-assistant.io/frontend/custom-ui/demo/
#
# Each entry in `demos` holds the configuration of its cards, the same as in
# a dashboard. A demo gets the entities of `entities` that its cards name in
# their `entity`, or that are in the `area` of a card, with that area from
# `areas`.

entities:
  - entity_id: light.bedroom
    state: "on"
    attributes:
      friendly_name: Bedroom
      supported_color_modes:
        - brightness
      color_mode: brightness
      brightness: 120
  - entity_id: light.office
    state: "on"
    attributes:
      friendly_name: Office
      supported_color_modes:
        - brightness
      color_mode: brightness
      brightness: 230
  - entity_id: sensor.cpu_usage
    state: "34"
    attributes:
      friendly_name: CPU usage
      state_class: measurement
      unit_of_measurement: "%"
  - entity_id: sensor.kitchen_humidity
    state: "52"
    attributes:
      friendly_name: Kitchen humidity
      device_class: humidity
      state_class: measurement
      unit_of_measurement: "%"

  # Card features, see source/dashboards/features.markdown
  - entity_id: alarm_control_panel.home_alarm
    state: disarmed
    attributes:
      friendly_name: Home alarm
      code_arm_required: false
      supported_features: 55
  - entity_id: sensor.phone_battery
    state: "72"
    attributes:
      friendly_name: Phone battery
      device_class: battery
      state_class: measurement
      unit_of_measurement: "%"
  - entity_id: button.restart_router
    state: "2026-11-04T08:15:00+00:00"
    attributes:
      friendly_name: Restart router
      device_class: restart
  - entity_id: climate.living_room
    state: heat
    attributes:
      friendly_name: Living room
      current_temperature: 20.5
      temperature: 21
      min_temp: 7
      max_temp: 30
      target_temp_step: 0.5
      hvac_action: heating
      hvac_modes:
        - auto
        - heat_cool
        - heat
        - cool
        - dry
        - fan_only
        - "off"
      fan_mode: low
      fan_modes:
        - "off"
        - low
        - medium
        - high
      preset_mode: home
      preset_modes:
        - home
        - eco
      swing_mode: "on"
      swing_modes:
        - "on"
        - "off"
      swing_horizontal_mode: "off"
      swing_horizontal_modes:
        - "on"
        - "off"
      supported_features: 953
  - entity_id: climate.bedroom
    state: heat
    attributes:
      friendly_name: Bedroom
      current_temperature: 18.5
      temperature: 19
      min_temp: 7
      max_temp: 30
      target_temp_step: 0.5
      hvac_action: heating
      hvac_modes:
        - heat
        - "off"
      supported_features: 1
  - entity_id: counter.coffees_today
    state: "3"
    attributes:
      friendly_name: Coffees today
      initial: 0
      step: 1
      minimum: 0
      maximum: 20
  - entity_id: cover.living_room_blinds
    state: open
    attributes:
      friendly_name: Living room blinds
      device_class: blind
      current_position: 70
      supported_features: 15
  - entity_id: cover.pergola_roof
    state: open
    attributes:
      friendly_name: Pergola roof
      device_class: awning
      current_tilt_position: 60
      supported_features: 240
  - entity_id: date.next_filter_change
    state: "2026-12-01"
    attributes:
      friendly_name: Next filter change
  - entity_id: fan.ceiling_fan
    state: "on"
    attributes:
      friendly_name: Ceiling fan
      percentage: 67
      percentage_step: 33.333333333333336
      direction: forward
      oscillating: false
      preset_mode: auto
      preset_modes:
        - auto
        - smart
        - sleep
        - "on"
      supported_features: 63
  - entity_id: humidifier.bedroom_humidifier
    state: "on"
    attributes:
      friendly_name: Bedroom humidifier
      device_class: humidifier
      humidity: 45
      current_humidity: 41
      min_humidity: 30
      max_humidity: 70
      mode: home
      available_modes:
        - home
        - eco
        - sleep
        - boost
      supported_features: 1
  - entity_id: lawn_mower.front_lawn
    state: docked
    attributes:
