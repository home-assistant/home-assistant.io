        - type: divider
        - type: buttons
          entities:
            - entity: light.office_ceiling
              name: Office Ceiling
            - entity: light.dining_ceiling
              name: Dining Ceiling

  # Glance card, the basic example of source/_dashboards/glance.markdown
  glance_sample:
    - type: glance
      title: Glance card sample
      entities:
        - binary_sensor.movement_backyard
        - light.bed_light
        - binary_sensor.basement_floor_wet
        - sensor.outside_temperature
        - light.ceiling_lights
        - switch.ac
        - lock.kitchen_door

  # The cards at the top of source/_dashboards/sensor.markdown,
  # thermostat.markdown, humidifier.markdown, media-control.markdown and
  # plant-status.markdown
  sensor_top:
    - type: sensor
      entity: sensor.study_temperature
      graph: line

  thermostat_top:
    - type: thermostat
      entity: climate.heatpump

  humidifier_top:
    - type: humidifier
      entity: humidifier.humidifier

  media_control_top:
    - type: media-control
      entity: media_player.living_room_speaker

  plant_status_top:
    - type: plant-status
      entity: plant.bonsai

  # Alarm panel card, source/_dashboards/alarm-panel.markdown
  alarm_panel_top:
    - type: alarm-panel
      entity: alarm_control_panel.alarm

  alarm_panel_title:
    - type: alarm-panel
      name: House Alarm
      entity: alarm_control_panel.alarm

  # Heading card, the example at the top of source/_dashboards/heading.markdown
  # and a subtitle with a button badge
  heading_top:
    - type: heading
      heading: Kitchen
      icon: mdi:fridge
      badges:
        - type: entity
          entity: sensor.kitchen_temperature
        - type: entity
          entity: sensor.kitchen_humidity
    - type: heading
      heading: Lights
      heading_style: subtitle
      icon: mdi:lightbulb
      badges:
        - type: button
          icon: mdi:lightbulb-off
          text: Turn off lights
          color: yellow

  # Markdown card, the examples of source/_dashboards/markdown.markdown
  markdown_example:
    - type: markdown
      content: >
        ## Dashboards

        Starting with Home Assistant 0.72, we're experimenting with a new way of defining your interface.

  markdown_alerts:
    - type: markdown
      content: |
        <ha-alert alert-type="error">This is an error alert — check it out!</ha-alert>
        <ha-alert alert-type="warning">This is a warning alert — check it out!</ha-alert>
        <ha-alert alert-type="info">This is an info alert — check it out!</ha-alert>
        <ha-alert alert-type="success">This is a success alert — check it out!</ha-alert>
        <ha-alert title="Test alert">This is an alert with a title</ha-alert>

  markdown_qr:
    - type: markdown
      content: >-
        <ha-qr-code data='hallo' width="180"></ha-qr-code>

        <ha-qr-code data='hallo' scale="6" margin="0"
        center-image="/static/icons/favicon-192x192.png"></ha-qr-code>

        <ha-qr-code data='hallo' error-correction-level="quartile" scale="6"
        center-image="https://brands.home-assistant.io/_/tuya/icon@2x.png"></ha-qr-code>

  # Weather forecast card, the cards at the top of
  # source/_dashboards/weather-forecast.markdown: with the daily forecast, and
  # without a forecast
  weather_top:
    - type: weather-forecast
      entity: weather.home
      forecast_type: daily
    - type: weather-forecast
      entity: weather.home
      show_forecast: false

  # Calendar card, source/_dashboards/calendar.markdown. The calendars get
  # sample events around today.
  calendar_top:
    - type: calendar
      entities:
        - calendar.home
        - calendar.work
      grid_options:
        rows: 10

  # To-do list card, source/_dashboards/todo-list.markdown
  todo_list_top:
    - type: todo-list
      entity: todo.shopping_list
      title: Shopping list

  # Area card, the cards at the top of source/_dashboards/area.markdown. Areas
  # in the demo have no picture, so each shows its icon instead.
  area_top:
    - type: area
      area: bedroom
      display_type: compact
      sensor_classes:
        - temperature
        - humidity
      grid_options:
        columns: 6
    - type: area
      area: garage
      display_type: compact
      sensor_classes:
        - temperature
        - humidity
        - illuminance
      features:
        - type: area-controls
      grid_options:
        columns: 6
    - type: area
      area: office
      display_type: icon
      sensor_classes:
        - temperature
        - humidity
        - illuminance
      features:
        - type: area-controls
      grid_options:
        columns: 6
    - type: area
      area: kitchen
      display_type: icon
      sensor_classes:
        - temperature
        - humidity
      grid_options:
        columns: 6

  # Light card, the names example of source/_dashboards/light.markdown
  light_names:
    - type: light
      entity: light.bedroom
      name: Kids Bedroom
      grid_options:
        columns: 6
    - type: light
      entity: light.office
      name: My Office
      grid_options:
        columns: 6

  # Gauge card, the examples of source/_dashboards/gauge.markdown
  gauge_name_unit:
    - type: gauge
      name: CPU Usage
      unit: "%"
      entity: sensor.cpu_usage

  gauge_segments:
    - type: gauge
      entity: sensor.kitchen_humidity
      needle: true
      min: 20
      max: 80
      segments:
        - from: 0
          color: "#db4437"
        - from: 35
          color: "#ffa600"
        - from: 40
          color: "#43a047"
        - from: 60
          color: "#ffa600"
        - from: 65
          color: "#db4437"

  # The tile cards at the top of source/_dashboards/tile.markdown, in two
  # sections of a sections view
  tile_sections:
    view:
      type: sections
      max_columns: 2
      sections:
        - type: grid
          cards:
            - type: heading
              heading: Living room
              icon: mdi:sofa
              badges:
                - type: entity
                  entity: sensor.living_room_temperature
                - type: entity
                  entity: sensor.living_room_humidity
            - type: tile
              entity: light.floor_lamp
            - type: tile
              entity: light.spotlights
              features:
                - type: light-brightness
            - type: tile
              entity: light.bar_lamp
            - type: tile
              entity: cover.blinds
            - type: tile
              entity: media_player.speaker
        - type: grid
          cards:
            - type: heading
              heading: Climate
              icon: mdi:thermometer
            - type: tile
              entity: sun.sun
            - type: tile
              entity: sensor.rain
            - type: tile
              entity: climate.downstairs
              state_content:
                - preset_mode
                - current_temperature
              features:
                - type: target-temperature
            - type: tile
              entity: climate.upstairs
              state_content:
                - preset_mode
                - current_temperature
              features:
                - type: target-temperature

  # The view types on source/dashboards/views.markdown, one tab each
  view_types:
    dashboard:
      title: View types
      views:
        - title: Sections
          path: sections
          type: sections
          max_columns: 2
          sections:
            - type: grid
              cards:
                - type: heading
                  heading: Kitchen
                - type: tile
                  entity: light.kitchen_ceiling
                - type: tile
                  entity: light.kitchen_counter
                - type: tile
                  entity: fan.kitchen_fan
                - type: tile
                  entity: switch.kettle
            - type: grid
              cards:
                - type: heading
                  heading: Climate
                - type: tile
                  entity: climate.living_room
                  features:
                    - type: target-temperature
        - title: Masonry
          path: masonry
          type: masonry
          cards:
            - type: entities
              title: Kitchen
              entities:
                - light.kitchen_ceiling
                - light.kitchen_counter
                - fan.kitchen_fan
                - switch.kettle
            - type: thermostat
              entity: climate.living_room
            - type: tile
              entity: sensor.kitchen_temperature
            - type: tile
              entity: sensor.kitchen_air_humidity
            - type: media-control
              entity: media_player.living_room_speaker
        - title: Panel
          path: panel
          type: panel
          cards:
            - type: thermostat
              entity: climate.living_room
        - title: Sidebar
          path: sidebar
          type: sidebar
          cards:
            - type: thermostat
              entity: climate.living_room
            - type: media-control
              entity: media_player.living_room_speaker
            - type: tile
              entity: sensor.kitchen_temperature
              view_layout:
                position: sidebar
            - type: tile
              entity: sensor.kitchen_air_humidity
              view_layout:
                position: sidebar
            - type: tile
              entity: switch.kettle
              view_layout:
                position: sidebar
