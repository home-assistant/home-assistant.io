items:
  - question: Where do I find support?
    answer: Support for Home Assistant (and other Open Home Foundation projects) is done by community members who volunteer their time to help out fellow hobbyists. They are the most active on the Discourse forums and the Discord server, however you may also find some help in the Facebook group and on Reddit.
  - question: How can I contribute to the project?
    answer: <p>Well, it depends! If you got the dev skills (whether you're a beginner or expert), <a href="https://developers.home-assistant.io/docs/review-process#before-creating-your-pr">start here</a> so you know how to craft a PR and then check out the documentation <a href="https://developers.home-assistant.io/docs/development_index">starting at Core</a> to familiarize yourself with the architecture. Follow the instructions on that page to join the Developers category in our Discord server to chat with other developers.</p><p>If you're knowledgeable in any aspect of Home Assistant, don't be nervous to hop onto one (or more) of our community platforms to get started helping others out. This is a great way to contribute if you aren't a developer. Additionally, if you're a designer passionate about Home Assistant, we'd love for you to check out our Developers category in Discord (choose I want to contribute design skills! when you follow the same steps as linked above).</p><p>Supporting us monetarily can only be done in a couple different ways currently. From our commercial partner, <a href="https://www.nabucasa.com/">Nabu Casa</a>, you can subscribe to <a href="https://support.nabucasa.com/hc/articles/25649130769949-Enabling-Home-Assistant-Cloud">Home Assistant Cloud</a> or purchase their officially licensed hardware. In the near future, we hope to re-launch our merch store where community members can purchase swag to support the foundation.</p>
  - question: Where can I find regional communities?
    answer: <p>This is not an exhaustive list of regional communities, but the ones that we are aware of. See yours missing? Let us know!</p><ul><li><a href="https://forum.hacf.fr/">Home Assistant Communauté Francophone</a></li><li><a href="https://discord.com/invite/6PWva4TYXz">Community Smart Home</a> (German-speaking Discord Server) and <a href="https://community-smarthome.com/">their forums</a></li><li><a href="https://www.facebook.com/groups/HomeAssistantNL/">Home Assistant [DUTCH]</a> (Private FB group)</li><li><a href="https://www.facebook.com/groups/594073248777064">Home Assistant Enthusiasts - South Africa</a> (Private FB group)</li><li><a href="https://www.facebook.com/groups/homeassistantau">Home Assistant AU & NZ</a> (Australia & New Zealand - Public FB group)</li><li><a href="https://www.facebook.com/groups/homeassistant.island/">Home Assistant Ísland</a> (Iceland - Private FB group)</li></ul>
  - question: Can community hosts be reimbursed for fees related to their meetups?
    answer: Yes! Community is the foundation of Home Assistant, and we want to help make sure that meeting with other smart home enthusiasts is a stress-free experience. The Open Home Foundation will reimburse hosts for certain fees related to hosting a meetup. Check out our Expense Guidelines for Hosts for more information.
  - question: I have a suggestion for this page!
    answer: Excellent! Let Missy know here, and we'll put it under consideration.