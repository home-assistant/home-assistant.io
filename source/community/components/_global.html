<section id="global">
    <div class="container">
        <div class="content">
            <div class="content-inner">
                <h2>A Global Community, Growing Every Day</h2>
                <p>Wherever you are in the world, the community will be ready to share knowledge and ideas.</p>
            </div>
            <div class="stats" data-dsap>
                <div class="stat">
                    <div class="stat-value">
                        +<span data-value="1000"></span>
                    </div>
                    <div class="stat-label">
                        Events & Meetups Worldwide
                    </div>
                </div>
                <div class="stat">
                    <div class="stat-value">
                        +<span data-value="200"></span>
                    </div>
                    <div class="stat-label">
                        Contributors Every Month
                    </div>
                </div>
                <div class="stat">
                    <div class="stat-value">
                        +<span data-value="100000"></span>
                    </div>
                    <div class="stat-label">
                        Active Community Members
                    </div>
                </div>
            </div>
        </div>
        <div class="photos-wrapper">
            <div class="photos" data-dsap>
                <figure class="photo large">
                    <img src="https://picsum.photos/seed/1/500" alt="Community member working on a laptop" />
                    <figcaption>Community member working on a laptop</figcaption>
                </figure>
                <figure class="photo medium">
                    <img src="https://picsum.photos/seed/2/500" alt="Community member working on a laptop" />
                    <figcaption>Community member collaborating on a project</figcaption>
                </figure>
                <figure class="photo small">
                    <img src="https://picsum.photos/seed/3/500" alt="Community member working on a laptop" />
                    <figcaption>Community member sharing ideas</figcaption>
                </figure>
            </div>
        </div>
    </div>
</section>
