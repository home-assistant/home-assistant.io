blueprint:
  name: Run actions when Powerfox Local power usage is high
  description: Run actions when a Powerfox Local power sensor stays above a chosen threshold for a configured duration.
  domain: automation
  input:
    power_sensor:
      name: Power sensor
      selector:
        entity:
          filter:
            - integration: powerfox_local
              domain: sensor
              device_class: power
    threshold:
      name: Power threshold
      default: 4000
      selector:
        number:
          min: 1
          max: 25000
          step: 100
          unit_of_measurement: W
          mode: box
    duration:
      name: Duration
      description: How long power usage must remain above the threshold.
      default:
        minutes: 2
      selector:
        duration:
    actions:
      name: Actions
      description: Actions to run when power usage remains high, such as sending a notification.
      selector:
        action:

triggers:
  - trigger: numeric_state
    entity_id: !input power_sensor
    above: !input threshold
    for: !input duration

actions: !input actions
