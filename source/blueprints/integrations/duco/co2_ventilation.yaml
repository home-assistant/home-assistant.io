blueprint:
  name: Boost Duco ventilation based on CO2
  description: Boost a Duco fan when CO2 is high and return it to automatic mode when CO2 drops again.
  domain: automation
  input:
    co2_sensor:
      name: CO2 sensor
      selector:
        entity:
          filter:
            - integration: duco
              domain: sensor
              device_class: carbon_dioxide
    fan:
      name: Duco fan
      selector:
        entity:
          filter:
            - integration: duco
              domain: fan
    high_threshold:
      name: High CO2 threshold
      default: 1000
      selector:
        number:
          min: 400
          max: 5000
          step: 50
          unit_of_measurement: ppm
    low_threshold:
      name: Low CO2 threshold
      default: 800
      selector:
        number:
          min: 400
          max: 5000
          step: 50
          unit_of_measurement: ppm
    boost_percentage:
      name: Boost fan percentage
      default: 100
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
triggers:
  - trigger: numeric_state
    entity_id: !input co2_sensor
    above: !input high_threshold
    id: boost
  - trigger: numeric_state
    entity_id: !input co2_sensor
    below: !input low_threshold
    id: auto
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: boost
        sequence:
          - action: fan.set_percentage
            target:
              entity_id: !input fan
            data:
              percentage: !input boost_percentage
      - conditions:
          - condition: trigger
            id: auto
        sequence:
          - action: fan.set_percentage
            target:
              entity_id: !input fan
            data:
              percentage: 0
