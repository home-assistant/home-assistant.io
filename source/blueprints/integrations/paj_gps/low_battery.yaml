blueprint:
  name: Notify when a PAJ GPS battery is low
  description: Run actions when a PAJ GPS tracker battery drops below a chosen level.
  domain: automation
  input:
    battery_sensor:
      name: Battery sensor
      selector:
        entity:
          filter:
            - integration: paj_gps
              domain: sensor
              device_class: battery
    battery_level:
      name: Battery level
      description: Run the actions when the battery drops below this level.
      default: 25
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider
    actions:
      name: Actions
      description: Actions to run when the battery is low, such as sending a notification.
      selector:
        action:

triggers:
  - trigger: numeric_state
    entity_id: !input battery_sensor
    below: !input battery_level

actions: !input actions
