blueprint:
  name: Run actions when APC UPS load is high
  description: Run actions when an APC UPS load sensor rises above a chosen percentage.
  domain: automation
  input:
    load_sensor:
      name: UPS load sensor
      selector:
        entity:
          filter:
            - integration: apcupsd
              domain: sensor
              unit_of_measurement: "%"
    threshold:
      name: Load threshold
      default: 80
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
    actions:
      name: Actions
      selector:
        action:
triggers:
  - trigger: numeric_state
    entity_id: !input load_sensor
    above: !input threshold
actions: !input actions
