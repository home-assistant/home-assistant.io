blueprint:
  name: Run actions when AdGuard Home DNS processing is slow
  description: Run actions when the average DNS processing time exceeds a chosen threshold.
  domain: automation
  input:
    processing_speed_sensor:
      name: Average processing speed sensor
      selector:
        entity:
          filter:
            - integration: adguard
              domain: sensor
    threshold:
      name: Processing time threshold
      description: Run the actions when average DNS processing time rises above this value.
      default: 50
      selector:
        number:
          min: 1
          max: 1000
          step: 1
          unit_of_measurement: ms
          mode: box
    actions:
      name: Actions
      description: Actions to run when DNS processing is slow, such as sending a notification.
      selector:
        action:

triggers:
  - trigger: numeric_state
    entity_id: !input processing_speed_sensor
    above: !input threshold

actions: !input actions
