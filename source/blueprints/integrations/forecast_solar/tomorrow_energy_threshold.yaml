blueprint:
  name: Run actions when tomorrow's solar forecast is high
  description: Run actions when Forecast.Solar predicts more than a chosen amount of energy production tomorrow.
  domain: automation
  input:
    forecast_sensor:
      name: Tomorrow energy forecast sensor
      selector:
        entity:
          filter:
            - integration: forecast_solar
              domain: sensor
              device_class: energy
    threshold:
      name: Forecast threshold
      description: Use the same energy unit shown by the selected sensor.
      default: 10
      selector:
        number:
          min: 0
          max: 100
          step: 0.5
          mode: box
    actions:
      name: Actions
      selector:
        action:
triggers:
  - trigger: numeric_state
    entity_id: !input forecast_sensor
    above: !input threshold
actions: !input actions
