blueprint:
  name: Run actions when the EnergyZero electricity price is low
  description: Run actions when the current EnergyZero electricity price drops below a chosen threshold.
  domain: automation
  input:
    price_sensor:
      name: Current electricity price sensor
      selector:
        entity:
          filter:
            - integration: energyzero
              domain: sensor
    threshold:
      name: Price threshold
      default: 0.10
      selector:
        number:
          min: -1
          max: 2
          step: 0.01
          unit_of_measurement: "€/kWh"
          mode: box
    actions:
      name: Actions
      selector:
        action:
triggers:
  - trigger: numeric_state
    entity_id: !input price_sensor
    below: !input threshold
actions: !input actions
