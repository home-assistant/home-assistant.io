blueprint:
  name: Run actions when an Ohme charger status changes
  description: Run actions when the selected Ohme charger status changes from a chosen state.
  domain: automation
  input:
    status_sensor:
      name: Charger status sensor
      selector:
        entity:
          filter:
            - integration: ohme
              domain: sensor
              device_class: enum
    from_state:
      name: Previous charger status
      description: Run the actions when the charger leaves this status.
      default: unplugged
      selector:
        text:
    actions:
      name: Actions
      selector:
        action:
variables:
  from_state: !input from_state
triggers:
  - trigger: state
    entity_id: !input status_sensor
conditions:
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none and trigger.from_state.state == from_state }}
actions: !input actions
