blueprint:
  name: Run actions when Fresh-r humidity is high
  description: Run actions when a Fresh-r humidity sensor rises above a chosen threshold.
  domain: automation
  input:
    humidity_sensor:
      name: Humidity sensor
      selector:
        entity:
          filter:
            - integration: freshr
              domain: sensor
              device_class: humidity
    threshold:
      name: Humidity threshold
      default: 70
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
    actions:
      name: Actions
      selector:
        action:
triggers:
  - trigger: numeric_state
    entity_id: !input humidity_sensor
    above: !input threshold
actions: !input actions
