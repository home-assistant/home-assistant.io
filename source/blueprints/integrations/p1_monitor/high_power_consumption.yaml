blueprint:
  name: Run actions when P1 Monitor power consumption is high
  description: Run actions when P1 Monitor power consumption stays above a chosen threshold for a configured duration.
  domain: automation
  input:
    power_sensor:
      name: Power consumption sensor
      selector:
        entity:
          filter:
            - integration: p1_monitor
              domain: sensor
              device_class: power
    threshold:
      name: Power threshold
      default: 4000
      selector:
        number:
          min: 1
          max: 25000
          step: 100
          unit_of_measurement: W
          mode: box
    duration:
      name: Duration
      default:
        minutes: 2
      selector:
        duration:
    actions:
      name: Actions
      selector:
        action:
triggers:
  - trigger: numeric_state
    entity_id: !input power_sensor
    above: !input threshold
    for: !input duration
actions: !input actions
