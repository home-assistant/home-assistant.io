blueprint:
  name: "Marantz RS-232 scheduled standby"
  description: >
    Turn off the main zone or multi-room output at a chosen time each day.
  domain: automation
  author: balloob
  input:
    receiver:
      name: "Receiver output"
      description: "Select the main zone or multi-room media player."
      selector:
        entity:
          filter:
            - integration: marantz_rs232
              domain: media_player
    standby_time:
      name: "Standby time"
      default: "23:00:00"
      selector:
        time:

triggers:
  - trigger: time
    at: !input standby_time

conditions:
  - condition: state
    entity_id: !input receiver
    state: "on"

actions:
  - action: media_player.turn_off
    target:
      entity_id: !input receiver
