blueprint:
  name: Run actions when an Autarco battery is low
  description: Run actions when an Autarco battery state of charge drops below a chosen percentage.
  domain: automation
  input:
    battery_sensor:
      name: Battery state of charge sensor
      selector:
        entity:
          filter:
            - integration: autarco
              domain: sensor
              device_class: battery
    threshold:
      name: Battery threshold
      default: 20
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider
    actions:
      name: Actions
      selector:
        action:
triggers:
  - trigger: numeric_state
    entity_id: !input battery_sensor
    below: !input threshold
actions: !input actions
