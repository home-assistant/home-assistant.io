blueprint:
  name: easyEnergy turn on a device at a low price
  description: >
    Turn on a switch when the current electricity usage price drops below
    your chosen threshold. For example, start a dishwasher whose program can
    be started by a switch. It runs once when the price crosses below the
    threshold and leaves the switch on when prices rise. Enabling the
    automation while the price is already below the threshold does not
    turn on the switch.
    It can also run when price data becomes available again with a value
    below the threshold.
  domain: automation
  author: klaasnicolaas

  input:
    price_sensor:
      name: Current electricity usage price
      description: >
        Select the Current hour sensor on the easyEnergy
        Energy market price - Usage device. Its unit is EUR/kWh.
        Do not select a return, gas, next-hour, or daily summary sensor.
      selector:
        entity:
          filter:
            - integration: easyenergy
              domain: sensor

    price_threshold:
      name: Price threshold
      description: >
        Run when the price drops below this value in EUR/kWh.
        The sensor price includes VAT but excludes energy tax and purchase
        costs. Negative thresholds are supported.
      default: 0.15
      selector:
        number:
          mode: box
          step: 0.001
          unit_of_measurement: EUR/kWh

    switch_entity:
      name: Device switch
      description: >
        The switch to turn on at a low price. For a dishwasher, select a
        switch that starts its program, not just its power supply.
      selector:
        entity:
          filter:
            - domain: switch

triggers:
  - trigger: numeric_state
    entity_id: !input price_sensor
    below: !input price_threshold

actions:
  - action: switch.turn_on
    target:
      entity_id: !input switch_entity
