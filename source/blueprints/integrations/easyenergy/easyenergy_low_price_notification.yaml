blueprint:
  name: easyEnergy low price notification
  description: >
    Send a notification when the current electricity usage price drops below
    your chosen threshold. It runs once when the price crosses below the
    threshold, rather than on every price update. Enabling the automation
    while the price is already below the threshold does not send a notification.
    It can also run when price data becomes available again with a value
    below the threshold.
  domain: automation
  author: klaasnicolaas

  input:
    price_sensor:
      name: Current electricity usage price
      description: >
        Select the Current hour sensor on the easyEnergy
        Energy market price - Usage device. Its unit is EUR/kWh.
        Do not select a return, gas, next-hour, or daily summary sensor.
      selector:
        entity:
          filter:
            - integration: easyenergy
              domain: sensor

    price_threshold:
      name: Price threshold
      description: >
        Run when the price drops below this value in EUR/kWh.
        The sensor price includes VAT but excludes energy tax and purchase
        costs. Negative thresholds are supported.
      default: 0.15
      selector:
        number:
          mode: box
          step: 0.001
          unit_of_measurement: EUR/kWh

    notification_entity:
      name: Notification destination
      description: The notification entity to send the low price message to.
      selector:
        entity:
          filter:
            - domain: notify

triggers:
  - trigger: numeric_state
    entity_id: !input price_sensor
    below: !input price_threshold

actions:
  - action: notify.send_message
    target:
      entity_id: !input notification_entity
    data:
      title: "Low energy price"
      message: >
        The current electricity usage price is
        {{ trigger.to_state.state }} EUR/kWh.
