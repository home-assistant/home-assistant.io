blueprint:
  name: Run actions when a Volvo door is left open
  description: Run actions when one of the selected Volvo door or tailgate sensors remains open for a chosen duration.
  domain: automation
  input:
    door_sensors:
      name: Door and tailgate sensors
      selector:
        entity:
          multiple: true
          filter:
            - integration: volvo
              domain: binary_sensor
    duration:
      name: Open duration
      default:
        minutes: 5
      selector:
        duration:
    actions:
      name: Actions
      selector:
        action:
triggers:
  - trigger: state
    entity_id: !input door_sensors
    to: "on"
    for: !input duration
actions: !input actions
