blueprint:
  name: Announce incoming phone calls
  description: >-
    Run actions when caller ID information is received from a Phone Modem.
    The caller name and number are available as variables for use in the actions.
  domain: automation
  input:
    caller_id_sensor:
      name: Incoming call sensor
      description: The incoming call sensor provided by the Phone Modem integration.
      selector:
        entity:
          filter:
            - integration: modem_callerid
              domain: sensor
    actions:
      name: Actions
      description: >-
        Actions to run when caller ID information is received. The variables
        `caller_name` and `caller_number` are available in templates.
      selector:
        action:

triggers:
  - trigger: state
    entity_id: !input caller_id_sensor
    to: "callerid"

variables:
  caller_id_sensor: !input caller_id_sensor
  caller_name: "{{ state_attr(caller_id_sensor, 'cid_name') | default('', true) }}"
  caller_number: "{{ state_attr(caller_id_sensor, 'cid_number') | default('', true) }}"

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ caller_number | length > 0 }}"
        sequence: !input actions
