blueprint:
  name: Save a Blink video when motion is detected
  description: Save the latest Blink video to a local path when motion is detected.
  domain: automation
  input:
    motion_sensor:
      name: Motion sensor
      selector:
        entity:
          filter:
            - integration: blink
              domain: binary_sensor
    camera:
      name: Blink camera
      selector:
        entity:
          filter:
            - integration: blink
              domain: camera
    filename:
      name: Filename
      description: Local filename for the saved video. Templates are supported.
      default: "/tmp/videos/blink_video_{{ now().strftime('%Y%m%d_%H%M%S') }}.mp4"
      selector:
        text:

triggers:
  - trigger: state
    entity_id: !input motion_sensor
    to: "on"

actions:
  - action: blink.save_video
    target:
      entity_id: !input camera
    data:
      filename: !input filename
