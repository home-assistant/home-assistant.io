blueprint:
  name: Run actions when Tessie charging is complete
  description: Run actions when a Tessie vehicle stops charging after reaching a chosen battery level.
  domain: automation
  input:
    charging_sensor:
      name: Battery charging sensor
      selector:
        entity:
          filter:
            - integration: tessie
              domain: binary_sensor
              device_class: battery_charging
    battery_sensor:
      name: Battery level sensor
      selector:
        entity:
          filter:
            - integration: tessie
              domain: sensor
              device_class: battery
    minimum_soc:
      name: Minimum state of charge
      default: 80
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
    actions:
      name: Actions
      selector:
        action:
variables:
  battery_sensor: !input battery_sensor
  minimum_soc: !input minimum_soc
triggers:
  - trigger: state
    entity_id: !input charging_sensor
    from: "on"
    to: "off"
conditions:
  - condition: template
    value_template: >-
      {% set level = states(battery_sensor) | float(none) %}
      {{ level is not none and level >= minimum_soc | float }}
actions: !input actions
