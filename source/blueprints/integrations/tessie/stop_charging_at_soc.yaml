blueprint:
  name: Stop Tessie charging at a target state of charge
  description: Turn off a Tessie charging switch when the vehicle battery reaches a chosen percentage.
  domain: automation
  input:
    battery_sensor:
      name: Battery level sensor
      selector:
        entity:
          filter:
            - integration: tessie
              domain: sensor
              device_class: battery
    charging_switch:
      name: Charging switch
      selector:
        entity:
          filter:
            - integration: tessie
              domain: switch
    target_soc:
      name: Target state of charge
      default: 80
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
variables:
  battery_sensor: !input battery_sensor
  target_soc: !input target_soc

triggers:
  - trigger: state
    entity_id: !input battery_sensor

conditions:
  - condition: template
    value_template: >-
      {% set current = states(battery_sensor) | float(none) %}
      {{ current is not none and current >= target_soc | float }}

actions:
  - action: switch.turn_off
    target:
      entity_id: !input charging_switch
