<section id="faq">
  <div class="container">
    <div class="content">
      <h2>Questions, answered</h2>

      <div class="accordion">
        {% for item in site.data["wth-faq"].items %}
        <div class="accordion-item">
          <input type="checkbox" class="accordion-item-checkbox" id="wth-{{ item.question | slugify }}" />
          <label for="wth-{{ item.question | slugify }}" class="accordion-item-heading">
            <span class="accordion-item-heading-title">{{ item.question }}</span>
            <span class="accordion-item-heading-icon" aria-hidden="true"></span>
          </label>
          <div class="accordion-item-content">
            <div class="accordion-item-content-inner">
              {{ item.answer }}
            </div>
          </div>
        </div>
        {% endfor %}
      </div>
    </div>
  </div>
</section>
