{% if page.hero_unit %}
<script type="text/javascript">
  {
    const changeNavColor = () => {
      const scrollPosition = document.documentElement.scrollTop;
      const nav = document.querySelector("header");
      if (scrollPosition <= 1) {
        nav.classList.add("dark");
      } else {
        nav.classList.remove("dark");
      }
    }
  
    window.addEventListener("load", () => changeNavColor());
    window.addEventListener("scroll", () => changeNavColor(), { passive: true });
  }
</script>
{% endif %}

<script type="text/javascript">
  {
    const article = document.querySelector("article.post");
    if (article) {
      const iframes = article.querySelectorAll("iframe[data-src]");
      let loaded = false;
      if (iframes) {
        document.addEventListener('mousemove', loadLazyFrames, { passive: true, once: true });
        document.addEventListener('touchmove', loadLazyFrames, { passive: true, once: true });
        document.addEventListener('scroll', loadLazyFrames, { passive: true, once: true });

        function loadLazyFrames() {
          if (loaded) return;
          loaded = true;

          iframes.forEach((iframe) => {
            const src = iframe.getAttribute("data-src");
            if (src) {
              iframe.setAttribute("src", src);
              iframe.removeAttribute("data-src");
            }
          });
        }
      }
    }
  }
</script>

{% if page.toc %}
<script type="text/javascript">
  {
    const scrollButton = document.getElementById("back-to-top-button");
    const depthCircle = document.getElementById("depth");
    const footer = document.querySelector("footer");

    if (scrollButton && depthCircle && footer) {
      const circumference = depthCircle.getTotalLength();

      depthCircle.style.strokeDasharray = circumference;
      depthCircle.style.strokeDashoffset = circumference;

      const handleScroll = () => {
        const scrollY = window.scrollY;

        const footerTop = footer.offsetTop;
        const windowHeight = window.innerHeight;

        const scrollStart = 0;
        const scrollEnd = footerTop - windowHeight;
        let scrollProgress;

        if (scrollEnd <= scrollStart) {
          scrollProgress = 1;
        } else {
          scrollProgress = Math.min(
            Math.max((scrollY - scrollStart) / (scrollEnd - scrollStart), 0),
            1
          );
        }

        const footerOffset = -50;
        const footerIsVisible = scrollY + windowHeight >= footerTop - footerOffset;

        if (scrollY > 100 && !footerIsVisible) {
          scrollButton.classList.add("visible");
        } else {
          scrollButton.classList.remove("visible");
        }

        const offset = circumference - (scrollProgress * circumference);
        depthCircle.style.strokeDashoffset = offset;
      };

      scrollButton.addEventListener("click", () => {
        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      });

      window.addEventListener("scroll", handleScroll, { passive: true });

      handleScroll();
    }
  }
</script>

<script type="text/javascript">
  // Re-scroll to the hash anchor after page layout has settled.
  // Browsers attempt the initial scroll before fonts, icons, and deferred
  // scripts finish loading, so the target position is often wrong.
  if (window.location.hash) {
    window.addEventListener("load", function () {
      requestAnimationFrame(function () {
        var el = document.querySelector(window.location.hash);
        if (el) el.scrollIntoView();
      });
    });
  }
</script>

<script type="text/javascript">
  {
    const tocCurrent = document.querySelector(".toc-current");
    const blogTocList = document.querySelector("#toc-module #toc");

    if (tocCurrent || blogTocList) {
      const headings = Array.from(
        document.querySelectorAll("article h2, article h3")
      );

      if (headings.length > 0) {
        const getHeadingText = (heading) =>
          heading.childNodes[0].textContent.trim();

        if (tocCurrent) {
          tocCurrent.textContent = getHeadingText(headings[0]);
        }

        const siteHeader = document.querySelector(".site-header");
        const tocBar = document.getElementById("toc-bar");

        const getScrollOffset = () => {
          if (siteHeader && (window.innerWidth > 1280)) {
            return siteHeader.offsetHeight + 58;
          } else if (siteHeader && tocBar) {
            return siteHeader.offsetHeight + tocBar.offsetHeight + 20;
          }

          return 140;
        };

        const updateTocCurrent = () => {
          const scrollY = window.scrollY + getScrollOffset();
          let current = headings[0];

          for (const heading of headings) {
            if (heading.offsetTop <= scrollY) {
              current = heading;
            } else {
              break;
            }
          }

          if (tocCurrent) {
            tocCurrent.textContent = getHeadingText(current);
          }

          const titleLink = current.querySelector("a.title-link");
          const slug = titleLink && titleLink.getAttribute("name");

          const tocLists = [
            document.querySelector("#toc-bar #toc"),
            blogTocList,
          ].filter(Boolean);

          for (const tocList of tocLists) {
            tocList.querySelectorAll("a[aria-current]").forEach((a) => {
              a.removeAttribute("aria-current");
            });
            if (slug) {
              const activeLink = tocList.querySelector(`a[href="#${slug}"]`);
              if (activeLink) {
                activeLink.setAttribute("aria-current", "true");
              }
            }
          }
        };

        window.addEventListener("scroll", updateTocCurrent, { passive: true });
        updateTocCurrent();
      }

      const tocToggle = document.getElementById("toc-toggle");
      const tocList = document.getElementById("toc");
      if (tocToggle && tocList) {
        tocList.addEventListener("click", (e) => {
          if (e.target.closest("a")) {
            tocToggle.checked = false;
          }
        });
      }
    }
  }
</script>
{% endif %}
